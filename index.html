<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Valentine's Day</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #ffe6e6;
        color: #ff3366;
        margin: 0;
        padding: 0;
      }
      .heart {
        font-size: 100px;
        color: #ff3366;
        animation: heartbeat 1.5s infinite;
      }
      @keyframes heartbeat {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
      }
      .message {
        margin-top: 20px;
        font-size: 24px;
      }
    </style>
  </head>
  <body>
    <h1>Happy Valentine's Day!</h1>
    <div class="heart">❤️</div>
    <p class="message">
      To my beloved, you make my heart skip a beat. I love you!
    </p>
  </body>
</html>
